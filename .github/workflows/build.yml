# Build MapMap with Qt 6
name: Build

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtmultimedia'
        tools: 'tools_mingw1310'

    - name: Configure with qmake
      run: qmake mapmap.pro CONFIG+=release

    - name: Build
      run: mingw32-make -j4

    - name: Build and run tests
      run: |
        cd tests/
        qmake6 tests.pro
        mingw32-make -j4
        mingw32-make check
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Deploy Qt
      run: windeployqt --release --no-system-d3d-compiler "MapMap\MapMap.exe"

    - uses: actions/upload-artifact@v7
      with:
        name: MapMap-windows
        path: MapMap/


  build-ubuntu:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libqt6opengl6-dev \
          libqt6openglwidgets6 \
          pkg-config \
          qmake6 \
          qt6-base-dev \
          qt6-multimedia-dev \
          qt6-tools-dev

    - name: Configure with qmake
      run: qmake6 mapmap.pro

    - name: Build
      run: make -j$(nproc)

    - name: Build and run tests
      run: |
        cd tests/
        qmake6 tests.pro
        make -j$(nproc)
        QT_QPA_PLATFORM=offscreen make check

    - uses: actions/upload-artifact@v7
      with:
        name: MapMap-ubuntu
        path: mapmap


  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # Only the downloaded bottles are cached. Caching /opt/homebrew/Cellar is a
    # trap: the files come back, but Homebrew's symlinks (/opt/homebrew/opt/qt
    # and the bin/ entries) do not, so `brew --prefix qt`/bin points to a
    # directory that does not exist and qmake is not found.
    - name: Cache Homebrew downloads
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/Homebrew/downloads
        key: brew-${{ runner.os }}-qt-v2

    # Always run: `brew install` is a no-op when Qt is already installed, and it
    # is what creates the symlinks the following steps rely on.
    - name: Install dependencies
      run: |
        brew install qt
        echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

    - name: Check Qt installation
      run: qmake --version

    - name: Configure with qmake
      run: qmake mapmap.pro CONFIG+=release

    - name: Build
      run: make -j$(sysctl -n hw.logicalcpu)

    - name: Build and run tests
      run: |
        cd tests/
        qmake6 tests.pro
        make -j$(sysctl -n hw.logicalcpu)
        QT_QPA_PLATFORM=offscreen make check

    - uses: actions/upload-artifact@v7
      with:
        name: MapMap-macos
        path: MapMap.app/
