# Build MapMap with Qt 6 and run its tests.
#
# Every pull request is built and tested. The packages to download (disk image,
# archive, Windows folder) are made once a change is in dev or master, or when
# asked for, with "Run workflow" on the Actions page or
#   gh workflow run build.yml --ref <branch>
name: Build

on:
  push:
    branches: [ dev, master ]
  pull_request:
    branches: [ dev, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        modules: 'qtmultimedia'
        tools: 'tools_mingw1310'

    - name: Configure with qmake
      run: qmake mapmap.pro CONFIG+=release

    - name: Build
      run: mingw32-make -j4

    - name: Build and run tests
      run: |
        cd tests/
        qmake6 tests.pro
        mingw32-make -j4
        mingw32-make check
      env:
        QT_QPA_PLATFORM: offscreen

    - name: Deploy Qt
      if: github.event_name != 'pull_request'
      run: windeployqt --release --no-system-d3d-compiler "MapMap\MapMap.exe"

    - uses: actions/upload-artifact@v7
      if: github.event_name != 'pull_request'
      with:
        name: MapMap-windows
        path: MapMap/


  build-ubuntu:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libqt6opengl6-dev \
          libqt6openglwidgets6 \
          pkg-config \
          qmake6 \
          qt6-base-dev \
          qt6-multimedia-dev \
          qt6-tools-dev

    - name: Configure with qmake
      run: qmake6 mapmap.pro CONFIG+=release

    - name: Build
      run: make -j$(nproc)

    - name: Build and run tests
      run: |
        cd tests/
        qmake6 tests.pro
        make -j$(nproc)
        QT_QPA_PLATFORM=offscreen make check

    - name: Package
      if: github.event_name != 'pull_request'
      run: bash scripts/sh_package_linux.sh --skip-build

    - uses: actions/upload-artifact@v7
      if: github.event_name != 'pull_request'
      with:
        name: MapMap-ubuntu
        path: dist/*.tar.gz


  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    # The Qt of the Qt Company, not that of Homebrew: its libraries, which go
    # in the disk image, run on older versions of macOS and on Intel too.
    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: '6.11.3'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtmultimedia qthttpserver qtwebsockets'

    - name: Check Qt installation
      run: qmake --version

    # A pull request is only built for the processor of the build machine.
    - name: Configure with qmake
      run: qmake mapmap.pro CONFIG+=release "QMAKE_APPLE_DEVICE_ARCHS=${{ github.event_name == 'pull_request' && 'arm64' || 'x86_64 arm64' }}"

    - name: Build
      run: make -j$(sysctl -n hw.logicalcpu)

    - name: Build and run tests
      run: |
        cd tests/
        qmake6 tests.pro
        make -j$(sysctl -n hw.logicalcpu)
        QT_QPA_PLATFORM=offscreen make check

    - name: Package
      if: github.event_name != 'pull_request'
      run: bash scripts/sh_package_macos.sh --skip-build

    - uses: actions/upload-artifact@v7
      if: github.event_name != 'pull_request'
      with:
        name: MapMap-macos
        path: dist/*.dmg
