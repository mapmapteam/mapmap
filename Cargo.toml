[workspace]
resolver = "2"
members = [
    "crates/mapmap-core",
    "crates/mapmap-render",
    "crates/mapmap-media",
    "crates/mapmap-ui",
    "crates/mapmap-control",
    "crates/mapmap-ffi",
    "crates/mapmap",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["MapMap Contributors"]
license = "GPL-3.0"
repository = "https://github.com/johnjanik/mapmap"

[workspace.dependencies]
# Core dependencies
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"

# Graphics utilities
bytemuck = { version = "1.14", features = ["derive"] }
glam = "0.25"
image = "0.24"

# Async runtime
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"

# Concurrency
crossbeam-channel = "0.5"
rayon = "1.8"
parking_lot = "0.12"
arc-swap = "1.6"

# Media
ffmpeg-next = "6.1"

# UI
imgui = "0.11"
imgui-wgpu = "0.24"
imgui-winit-support = "0.11"

# Control
midir = "0.9"
rosc = "0.10"

# HTTP API
axum = "0.7"
tower = "0.4"
hyper = "1.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ron = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Testing
proptest = "1.4"
criterion = "0.5"

# Build dependencies
bindgen = "0.69"
cbindgen = "0.26"

[profile.dev]
opt-level = 1  # Slightly optimize for better wgpu performance in debug

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
